[package]
name = "chromoterm"
version = "0.5.2"
edition = "2024"
description = "Terminal manipulation library with a focus on ergonomics in Rust"
repository = "https://github.com/polyagonal1/chromoterm"
keywords = ["terminal", "cli"]
categories = ["command-line-interface"]
readme = "README.md"
license = "GPL-3.0-or-later"

[dependencies]
lexical-core = { version = "1", features = ["write-integers", "std"], default-features = false }
rustix = { version = "1", features = ["stdio", "termios"], optional = true }



[features]
nightly = []
any_cmds = []

raw_mode = ["rustix"]
window_size = ["rustix"]

alternate_screen = ["any_cmds"]
cursor_controls = ["any_cmds"]

erase_in_display_ext = ["erase_in_display"]
erase_in_line_ext = ["erase_in_line"]

erase_in_display = ["erase_functions"]
erase_in_line = ["erase_functions"]
erase_functions = ["any_cmds"]


[[example]]
name = "alternate_screen"
required-features = ["alternate_screen", "cursor_controls"]

[[example]]
name = "raw_mode"
required-features = ["raw_mode"]


[[bin]]
name = "log_input"
required-features = ["raw_mode"]